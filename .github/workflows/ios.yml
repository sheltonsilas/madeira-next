name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml

      - name: Run the unit tests on a simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MadeiraNext.xcodeproj \
            -scheme MadeiraNext \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO \
            test | tee test.log | tail -n 40

      - name: Build for a device without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project MadeiraNext.xcodeproj \
            -scheme MadeiraNext \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tail -n 40

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'MadeiraNext.app' -type d)
          test -n "$app"
          rm -rf Payload dist && mkdir -p Payload dist
          cp -R "$app" Payload/
          zip -qry dist/MadeiraNext-unsigned.ipa Payload
          rm -rf Payload
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('dist/MadeiraNext-unsigned.ipa'); sys.exit(1 if z.testzip() else 0)"

      - uses: actions/upload-artifact@v4
        with:
          name: MadeiraNext-unsigned-ipa
          path: dist/MadeiraNext-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
