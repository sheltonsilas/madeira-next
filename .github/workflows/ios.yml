name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Runs on GitHub's machines, not yours. A scheduled build is the whole point:
  # it happens whether or not the laptop that asked for it is awake, so an IPA
  # keeps being produced by a machine that never sleeps. Note that GitHub stops
  # a scheduled workflow after 60 days with no repository activity, which any
  # push clears.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch and trim the QEMU engine into the app's Frameworks
        # Downloaded from the published payload and trimmed to the aarch64 engine
        # and its dependencies, so the app can find it. Fails the build if the
        # engine is missing rather than shipping a build that cannot start machines.
        env:
          GH_TOKEN: ${{ secrets.PAYLOAD_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/fetch-engine.sh App/Frameworks Engine/share

      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml

      - name: Choose an iOS simulator
        # Not a hardcoded device name: the runner images do not all carry the
        # same simulators, and "iPhone 16" was absent on one, which failed the
        # run before a single test compiled.
        run: |
          set -euo pipefail
          pick='import json,sys;d=json.load(sys.stdin)["devices"];c=[(r,e["udid"]) for r,v in d.items() if "iOS" in r for e in v if e.get("isAvailable") and e["name"].startswith("iPhone")];c.sort();print(c[-1][1] if c else "")'
          udid=$(xcrun simctl list devices available --json | python3 -c "$pick")
          if [ -z "$udid" ]; then
            echo "::error::this runner has no available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "using simulator $udid"

      - name: Run the unit tests on a simulator
        run: |
          # The full log is written to test.log first and the failures are
          # printed from it, so a failing test reports its own assertion instead
          # of being cut off by a tail. The pipeline's status is preserved.
          set -euo pipefail
          if xcodebuild \
            -project MadeiraNext.xcodeproj \
            -scheme MadeiraNext \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO \
            test > test.log 2>&1
          then
            grep -E 'Executed [0-9]+ tests' test.log | tail -n 3
          else
            status=$?
            echo '--- failures ---'
            # -h: the assertion text, not the grep command echoed back.
            grep -hE "Test Case .* failed|XCTAssert.*failed|error:" test.log | head -n 60 || true
            echo '--- last lines ---'
            tail -n 30 test.log
            exit $status
          fi

      - name: Build for a device without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project MadeiraNext.xcodeproj \
            -scheme MadeiraNext \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tail -n 40

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'MadeiraNext.app' -type d)
          test -n "$app"
          rm -rf Payload dist && mkdir -p Payload dist
          cp -R "$app" Payload/
          # The engine is device-only, so it is copied into the packaged app rather
          # than linked: linking it into the simulator test build fails.
          if [ -d App/Frameworks ] && [ -n "$(ls -A App/Frameworks)" ]; then
            mkdir -p Payload/MadeiraNext.app/Frameworks
            cp -R App/Frameworks/. Payload/MadeiraNext.app/Frameworks/
          fi
          # The firmware, copied to share/ inside the bundle (see fetch-engine.sh).
          if [ -d Engine/share/qemu ]; then
            mkdir -p Payload/MadeiraNext.app/share
            cp -R Engine/share/. Payload/MadeiraNext.app/share/
          fi
          zip -qry dist/MadeiraNext-unsigned.ipa Payload
          rm -rf Payload
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('dist/MadeiraNext-unsigned.ipa'); sys.exit(1 if z.testzip() else 0)"
          python3 -c "import zipfile,sys; names=zipfile.ZipFile('dist/MadeiraNext-unsigned.ipa').namelist(); need='Payload/MadeiraNext.app/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu'; sys.exit(0 if need in names else 1)"
          # Nothing else resolves these install names: the app links none of the
          # engine's libraries. A framework trimmed away is an app that installs
          # and then dies inside dyld, which no simulator can reproduce.
          python3 tools/check_ipa_bundle.py dist/MadeiraNext-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MadeiraNext-unsigned-ipa
          path: dist/MadeiraNext-unsigned.ipa
          if-no-files-found: error
          # Kept short on purpose: 14 days is the retention GitHub allows cheaply,
          # and the artifact is not the durable copy. The release below is.
          retention-days: 14

  publish:
    # The one permanent copy. An artifact expires; a release asset does not, so
    # this is what makes "there is an IPA" still true in a month, on a machine
    # that has never seen this checkout.
    #
    # Only ever for main: a pull request runs this workflow, and a branch that
    # could repoint the release would be a fork writable into the release the
    # user installs from.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only what the job needs: reading back the artifact the build job
      # uploaded. `permissions:` is an allow-list, so leaving this out denies it.
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MadeiraNext-unsigned-ipa
          path: dist

      - name: Write the checksums and the provenance beside the IPA
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum MadeiraNext-unsigned.ipa > MadeiraNext-unsigned.ipa.sha256
          cat MadeiraNext-unsigned.ipa.sha256
          # The tag is rewritten by every build, so the tag alone says nothing
          # about which commit is inside the release. This is that answer, and
          # tools/fetch_latest_ipa.py --require-head reads it.
          python3 - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$REPO" <<'PY'
          import json, sys
          commit, run_id, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          with open("build-info.json", "w") as handle:
              json.dump({
                  "commit": commit,
                  "run_id": int(run_id),
                  "run_url": f"https://github.com/{repo}/actions/runs/{run_id}",
              }, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          cat build-info.json

      - name: Move the rolling release onto this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GH_REPO names the repository for every gh call below. Without it gh
          # looks for a git remote, and this job deliberately never checks the
          # repository out - it only needs the artifact the build job uploaded -
          # so gh failed with "not a git repository".
          tag=ipa-latest
          short=${GITHUB_SHA:0:7}
          # A quoted heredoc, so nothing in the text is expanded: the notes
          # spell the placeholder and sed substitutes it, rather than leaving
          # backticks to be read as command substitution.
          cat > notes.md <<'EOF'
          Unsigned, device-only IPA for iOS 17+, built from `__SHORT__` on `main`.

          This release is rewritten by every green build, so the assets here always
          name the newest one. It does not expire.

          - `MadeiraNext-unsigned.ipa` - device-only arm64, no signature, ready to re-sign
          - `MadeiraNext-unsigned.ipa.sha256` - what the file hashes to
          - `build-info.json` - the commit and run this was built from

          Sign it with your own Apple ID; see `docs/INSTALL.md`. Fetch it from a
          checkout with `python3 tools/fetch_latest_ipa.py`.
          EOF
          sed -i "s/__SHORT__/$short/" notes.md
          assets="dist/MadeiraNext-unsigned.ipa dist/MadeiraNext-unsigned.ipa.sha256 dist/build-info.json"
          # Upload over the existing release rather than deleting and recreating
          # it, so the URL never stops answering. A half-finished publish is
          # worse than a stale one.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --clobber
            gh release edit "$tag" --title "Madeira Next unsigned IPA (build $short)" --notes-file notes.md
          else
            gh release create "$tag" $assets \
              --title "Madeira Next unsigned IPA (build $short)" \
              --notes-file notes.md
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[].name)'
