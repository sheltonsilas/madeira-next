name: MadeiraNext
options:
  bundleIdPrefix: com.sheltonsilas
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  MadeiraNext:
    type: application
    platform: iOS
    sources:
      # The entitlements file and the bridging header are named explicitly as
      # settings below, so neither is also a resource: a copy of the
      # entitlements loose in the bundle would be a second, silent answer to
      # "what is this app signed with".
      - path: App
        excludes:
          - "MadeiraNext.entitlements"
          - "MadeiraNext-Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sheltonsilas.madeiranext
        # The JIT, kernel-memory and debugger entitlements the engine needs.
        # tools/sign_ipa.sh signs with this same file, and CI checks that the
        # keys survive a signature; see docs/INSTALL.md.
        CODE_SIGN_ENTITLEMENTS: App/MadeiraNext.entitlements
        # The app's one C file: App/EngineExitGuard.c, the exit interposer.
        SWIFT_OBJC_BRIDGING_HEADER: App/MadeiraNext-Bridging-Header.h
        PRODUCT_NAME: MadeiraNext
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  MadeiraNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MadeiraNext
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sheltonsilas.madeiranext.tests
schemes:
  MadeiraNext:
    build:
      targets:
        MadeiraNext: all
        MadeiraNextTests: [test]
    test:
      targets:
        - MadeiraNextTests
