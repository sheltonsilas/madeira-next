name: MadeiraNext
options:
  bundleIdPrefix: com.sheltonsilas
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  MadeiraNext:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sheltonsilas.madeiranext
        PRODUCT_NAME: MadeiraNext
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  MadeiraNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MadeiraNext
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sheltonsilas.madeiranext.tests
schemes:
  MadeiraNext:
    build:
      targets:
        MadeiraNext: all
        MadeiraNextTests: [test]
    test:
      targets:
        - MadeiraNextTests
